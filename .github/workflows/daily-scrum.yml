# Daily Scrum automática: una tarjeta por equipo y día, de lunes a viernes.
#
# Qué hace:
#   1. Calcula la fecha, la semana ISO y el facilitador/a de la semana (rotación Levi → Brian → Miguel).
#   2. Crea las etiquetas `daily` y `scrum` si no existen.
#   3. Comprueba que no exista ya la daily de hoy (salvo que se lance con `forzar`).
#   4. Crea el issue con la plantilla de la rutina y asigna a las tres personas.
#
# El Project NO se toca desde aquí: no se usa PAT ni el scope `project`.
# La tarjeta entra sola en el Project con el workflow integrado "Auto-add to project".
# Configuración del tablero, vistas y filtros: docs/dailies/README.md
#
# Columnas de la vista `Dailies` (campo `Estado daily`): Inicio / ¿Ha pasado algo? / Cierre.
# `Inicio` lo pone el valor por defecto del campo; los otros dos se arrastran a mano.
name: Daily Scrum

on:
  schedule:
    # 06:30 UTC = 08:30 en Madrid en verano (CEST) y 07:30 en invierno (CET).
    # Así, la daily de las 09:00 siempre encuentra la tarjeta creada.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Crear la daily aunque ya exista la de hoy"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# Sin solapes: si una ejecución se alarga, la siguiente espera en cola.
concurrency:
  group: daily-scrum
  cancel-in-progress: false

env:
  # Plantilla del cuerpo de la tarjeta. Marcadores: {{FECHA}}, {{SEMANA}}, {{NOMBRE}}, {{USUARIO}}.
  # Vive aquí para que no haya dos fuentes que mantener (no hay issue form que reutilizar).
  PLANTILLA: |
    **Equipo:** Levi Flores (`levifvy`) · Brian Hañari (`BrianStiv`) · Miguel Matesanz (`mmatesanzg23`)

    **Fecha:** {{FECHA}} · **Semana ISO:** {{SEMANA}} · **Sprint:** _(rellenar si aplica)_
    **Facilitador/a de la semana:** {{NOMBRE}} (@{{USUARIO}}) · **Duración:** 15 min

    **Tablero:** [Projects del repo](https://github.com/IA-P1-BCN/zapateria-paso-firme-g2/projects)
    **Regla:** una tarea del tablero = un flujo (o parte) = una rama = una PR.

    > **Cómo se mueve esta tarjeta.** Vive en la vista `Dailies` del Project, no en el `tablero`.
    > Al empezar la ronda, arrástrala de `Inicio` a `¿Ha pasado algo?`; al terminar, a `Cierre`.
    > Las tareas se mueven solas (`Status`); las dailys se mueven a mano (`Estado daily`).

    ## Tabla de la daily

    | Colaborador | Ayer | Hoy | Bloqueos |
    |---|---|---|---|
    | Levi Flores (`levifvy`) | | | |
    | Brian Hañari (`BrianStiv`) | | | |
    | Miguel Matesanz (`mmatesanzg23`) | | | |

    ## Antes de la daily (5 min, en asíncrono)

    - [ ] Mi tarjeta está en la columna real del `tablero`
    - [ ] He revisado mis PRs y el estado de la CI
    - [ ] He revisado los issues con etiqueta `bloqueado`
    - [ ] La spec de mi feature tiene el `Estado:` correcto

    ## Durante la daily (15 min)

    - [ ] Cada persona ha contado ayer / hoy / bloqueos (máx. 2 min)
    - [ ] Los bloqueos tienen issue y responsable
    - [ ] Hemos acordado el objetivo del día

    ## Rutina por rol (rota por feature)

    - [ ] **Dueño/a de la spec:** resuelvo los `<<PENDIENTE>>`, muevo la spec a Aprobada y aviso al equipo
    - [ ] **Constructor/a:** plan y tasks al día, JSON en `workflows/` con `active: false` y fixtures probados
    - [ ] **Revisor/a:** `/revisar-flujo` pasado, sin secretos ni datos personales, PR aprobada

    ## Acuerdos y siguientes pasos

    | Acuerdo | Responsable | Fecha |
    |---|---|---|
    | | | |

    ## Bloqueos abiertos

    _(uno por línea, con issue y responsable; si no hay, escribe «Ninguno»)_

    ## Historial de la daily

    _Una fila por transición, para que el recorrido quede escrito aunque el campo cambie._

    | Etapa | Hora | Qué ha pasado | Responsable |
    |---|---|---|---|
    | Inicio | | | |
    | ¿Ha pasado algo? | | | |
    | Cierre | | | |

    ## Después de la daily (5 min)

    - [ ] Tarjetas movidas y con responsable
    - [ ] WIP respetado (máx. 1 feature en curso por persona)
    - [ ] Cada PR tiene revisor distinto de quien construye
    - [ ] Si se usó IA, queda anotado para `/bitacora`

    ## Viernes (si aplica)

    - [ ] Refinamiento del backlog
    - [ ] Revisión del sprint
    - [ ] Retrospectiva breve
    - [ ] Confirmar la rotación del facilitador/a para la semana siguiente

    ## Reglas que no se negocian

    - Spec `Aprobada` antes de construir.
    - Una feature = una rama = una PR.
    - Sin credenciales ni datos personales en el repo.
    - Los importes los da la app; no se recalculan.
    - Revisión humana obligatoria antes de mergear.

    ---
    _Creada automáticamente por `.github/workflows/daily-scrum.yml` · rutina en [`docs/dailies/README.md`](https://github.com/IA-P1-BCN/zapateria-paso-firme-g2/blob/develop/docs/dailies/README.md). Al terminar la daily: mueve la tarjeta a `Cierre` y cierra el issue._

jobs:
  crear-daily:
    name: Crear la tarjeta de la daily
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calcular fecha, semana y facilitador/a
        id: datos
        run: |
          set -euo pipefail
          export TZ=Europe/Madrid
          fecha=$(date +%F)
          semana=$(date +%V)
          # Rotación semanal: Levi → Brian → Miguel.
          # Ancla: lunes 2026-10-26 (semana 1 = Levi). Si el proyecto arranca otro día, cambiar esta fecha.
          ancla=$(date -d "2026-10-26" +%s)
          hoy=$(date -d "$fecha" +%s)
          semanas=$(( (hoy - ancla) / 604800 ))
          idx=$(( (semanas % 3 + 3) % 3 ))
          nombres=("Levi Flores" "Brian Hañari" "Miguel Matesanz")
          usuarios=("levifvy" "BrianStiv" "mmatesanzg23")
          asignados=$(IFS=,; echo "${usuarios[*]}")
          {
            echo "fecha=$fecha"
            echo "semana=$semana"
            echo "nombre=${nombres[$idx]}"
            echo "usuario=${usuarios[$idx]}"
            echo "asignados=$asignados"
          } >> "$GITHUB_OUTPUT"
          echo "Daily de $fecha · semana ISO $semana · facilitador/a: ${nombres[$idx]} (${usuarios[$idx]})"

      - name: Crear las etiquetas si no existen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create daily \
            --color 0E8A16 \
            --description "Daily Scrum: ceremonia diaria del equipo" \
            --force
          gh label create scrum \
            --color 5319E7 \
            --description "Ceremonias y artefactos Scrum" \
            --force

      - name: Comprobar que no exista ya la daily de hoy
        id: existe
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ steps.datos.outputs.fecha }}
          FORZAR: ${{ inputs.forzar }}
        run: |
          set -euo pipefail
          if [ "$FORZAR" = "true" ]; then
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "Ejecución forzada: se crea una tarjeta nueva aunque exista la de hoy."
            exit 0
          fi
          if gh issue list --label daily --state all --limit 100 \
              --json title --jq '.[].title' | grep -Fxq "[Daily] $FECHA"; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "La daily de $FECHA ya existe; no se crea otra."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "No hay daily de $FECHA; se crea."
          fi

      - name: Crear la tarjeta de la daily
        if: steps.existe.outputs.existe != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FECHA: ${{ steps.datos.outputs.fecha }}
          SEMANA: ${{ steps.datos.outputs.semana }}
          NOMBRE: ${{ steps.datos.outputs.nombre }}
          USUARIO: ${{ steps.datos.outputs.usuario }}
          ASIGNADOS: ${{ steps.datos.outputs.asignados }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PLANTILLA" > daily.md
          sed -i \
            -e "s|{{FECHA}}|$FECHA|g" \
            -e "s|{{SEMANA}}|$SEMANA|g" \
            -e "s|{{NOMBRE}}|$NOMBRE|g" \
            -e "s|{{USUARIO}}|$USUARIO|g" \
            daily.md
          gh issue create \
            --title "[Daily] $FECHA" \
            --body-file daily.md \
            --label daily \
            --label scrum \
            --assignee "$ASIGNADOS"
