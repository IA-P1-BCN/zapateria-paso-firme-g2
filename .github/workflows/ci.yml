# CI: se ejecuta en cada PR hacia develop/main
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  tests-backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt

      - name: Ejecutar tests
        working-directory: backend
        run: python -m pytest -v

  validar-flujos-n8n:
    name: Validar JSONs de flujos n8n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar que todos los JSON parsean
        run: |
          set -e
          if [ -d flujos ]; then
            errores=0
            for f in $(find flujos -name '*.json'); do
              if jq empty "$f" 2>/dev/null; then
                echo "OK  $f"
              else
                echo "ERROR: $f no es un JSON válido"
                errores=1
              fi
            done
            exit $errores
          else
            echo "Sin carpeta flujos/ todavía, nada que validar"
          fi
